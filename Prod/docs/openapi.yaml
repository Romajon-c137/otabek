components:
  schemas:
    AuditRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_name:
          type: string
          readOnly: true
          nullable: true
        request_id:
          type: string
          maxLength: 80
        action:
          type: string
          maxLength: 80
        entity_type:
          type: string
          maxLength: 80
        entity_id:
          type: string
          maxLength: 64
        warehouse_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        before: {}
        after: {}
        metadata: {}
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_name
      - entity_id
      - entity_type
      - id
      - occurred_at
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    DirectionEnum:
      enum:
      - incoming
      - outgoing
      type: string
      description: |-
        * `incoming` - Приход
        * `outgoing` - Расход
    ExtraCost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - amount
      - id
      - name
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    MethodEnum:
      enum:
      - cash
      - mbank
      - aiyl
      type: string
      description: |-
        * `cash` - Наличные
        * `mbank` - МБанк
        * `aiyl` - Айыл Банк
    Obligation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        party:
          type: integer
        party_name:
          type: string
          readOnly: true
        warehouse:
          type: integer
        warehouse_name:
          type: string
          readOnly: true
        side:
          $ref: '#/components/schemas/SideEnum'
        original_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        open_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        effective_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          nullable: true
        source_document:
          type: integer
          nullable: true
        source_number:
          type: string
          readOnly: true
          nullable: true
        product:
          type: integer
          nullable: true
        original_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,3})?$
          nullable: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        reason:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        reversed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - effective_date
      - id
      - open_amount
      - original_amount
      - party
      - party_name
      - side
      - source_number
      - warehouse
      - warehouse_name
